<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TREES2B | The Drop is Imminent</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Space Grotesk', sans-serif; background-color: #050905; color: #fff; overflow: hidden; }
        
        /* The Interactive Canvas Background */
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* The Main Content */
        .container { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
        
        /* The Frosted Glass Card */
        .glass-panel { 
            background: rgba(10, 20, 10, 0.4); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(0, 255, 100, 0.15); 
            padding: 60px; 
            border-radius: 24px; 
            box-shadow: 0 0 40px rgba(0, 255, 100, 0.05); 
        }
        
        /* Typography */
        h1 { font-size: 4.5rem; text-transform: uppercase; letter-spacing: 8px; margin-bottom: 5px; background: linear-gradient(90deg, #ffffff, #00ff66); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { font-size: 1.1rem; color: #888; letter-spacing: 4px; margin-bottom: 40px; text-transform: uppercase; }
        
        /* Countdown Timer Grid */
        .countdown { display: flex; gap: 40px; justify-content: center; }
        .time-box { display: flex; flex-direction: column; align-items: center; width: 80px; }
        .time-box span { font-size: 3.5rem; font-weight: 700; color: #00ff66; text-shadow: 0 0 20px rgba(0, 255, 100, 0.3); }
        .time-box label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }
        
        /* Mobile Responsiveness */
        @media (max-width: 768px) { 
            h1 { font-size: 2.8rem; letter-spacing: 4px; } 
            .countdown { gap: 20px; } 
            .time-box span { font-size: 2.5rem; } 
            .glass-panel { padding: 40px 20px; width: 100%; max-width: 400px; } 
        }
    </style>
</head>
<body>
    <canvas id="network"></canvas>
    
    <div class="container">
        <div class="glass-panel">
            <h1>TREES2B</h1>
            <p class="subtitle">Releasing in</p>
            <div class="countdown">
                <div class="time-box"><span id="days">00</span><label>Days</label></div>
                <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
                <div class="time-box"><span id="minutes">00</span><label>Mins</label></div>
                <div class="time-box"><span id="seconds">00</span><label>Secs</label></div>
            </div>
        </div>
    </div>

    <script>
        // --- COUNTDOWN LOGIC ---
        // Sets the timer to exactly 10 days from the moment the code runs
        const targetDate = new Date().getTime() + (10 * 24 * 60 * 60 * 1000);
        
        function updateTime() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.querySelector('.countdown').innerHTML = "<span style='font-size: 2rem; color: #00ff66; letter-spacing: 4px;'>WE ARE LIVE</span>";
                return;
            }

            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById('minutes').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById('seconds').innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- PARTICLE BACKGROUND ANIMATION ---
        const canvas = document.getElementById('network');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8; // Speed
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1; // Size
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                // Bounce off edges
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 100, 0.6)'; 
                ctx.fill();
            }
        }

        // Create 70 particles
        for (let i = 0; i < 70; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); 
                particles[i].draw();
                
                // Draw connecting lines if close enough
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 130) {
                        ctx.beginPath(); 
                        ctx.moveTo(particles[i].x, particles[i].y); 
                        ctx.lineTo(particles[j].x, particles[j].y);
                        // Make line fade out the further away they are
                        ctx.strokeStyle = `rgba(0, 255, 100, ${0.3 - (dist/130)*0.3})`; 
                        ctx.lineWidth = 1; 
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
